name: Build & Publish Release APK

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
    - name: checkout code
      uses: actions/checkout@v6

    - name: Setup Java latest
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: 17
        force-download: true

    - name: Make Gradle executable
      run: chmod +x ./gradlew

    - name: Resolve Version
      id: version
      run: |
       if [[ "${{ github.ref_type }}" == "tag" ]]; then
         echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
       else
         echo "VERSION_NAME=1.0.${{ github.run_number }}" >> $GITHUB_ENV
       fi

    - name: Decode signing keystore
      if: env.HAS_SIGNING_KEY == 'true'
      env:
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      run: |
        mkdir -p "$RUNNER_TEMP/keystore"
        printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keystore/release.keystore"
        echo "KEYSTORE_FILE=$RUNNER_TEMP/keystore/release.keystore" >> "$GITHUB_ENV"

    - name: Build Release APK
      if: env.HAS_SIGNING_KEY == 'true'
      env:
        storepwd: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        keyalias: ${{ secrets.ANDROID_KEY_ALIAS }}
        keypwd: ${{ secrets.ANDROID_KEY_PASSWORD }}
      run: |
        ./gradlew clean assembleRelease \
          -PversionCode=${{ github.run_number }} \
          -PversionName=$VERSION_NAME

    - name: Build Debug APK
      if: env.HAS_SIGNING_KEY != 'true'
      run: |
        ./gradlew clean assembleDebug \
          -PversionCode=${{ github.run_number }} \
          -PversionName=$VERSION_NAME

    - name: Select APK
      run: |
        if [[ "$HAS_SIGNING_KEY" == "true" ]]; then
          echo "APK_PATH=app/build/outputs/apk/release/*.apk" >> "$GITHUB_ENV"
        else
          echo "APK_PATH=app/build/outputs/apk/debug/*.apk" >> "$GITHUB_ENV"
        fi

    - name: Upload Workflow Artifact
      uses: actions/upload-artifact@v6
      with:
        name: app-${{ env.VERSION_NAME }}
        path: ${{ env.APK_PATH }}

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v3
      with:
        generate_release_notes: true
        files: ${{ env.APK_PATH }}
