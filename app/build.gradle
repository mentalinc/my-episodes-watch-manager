apply plugin: 'com.android.application'

android {
    compileSdk = 37

    defaultConfig {
        applicationId = "nz.mentalinc.episodeWatcher"
        minSdk = 36
        targetSdk = 37
        versionCode = 41
        versionName = '1.9.14'

        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    // Signing material is never committed. Set KEYSTORE_FILE to an absolute path (CI decodes it
    // from a repository secret) together with storepwd/keyalias/keypwd. Without it, debug builds
    // use the automatically generated debug keystore and release builds stay unsigned.
    def releaseKeystore = System.getenv("KEYSTORE_FILE")

    signingConfigs {
        if (releaseKeystore) {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv("storepwd")
                keyAlias System.getenv("keyalias")
                keyPassword System.getenv("keypwd")
            }
        }
    }
    buildTypes {
        debug {
            versionNameSuffix '- DEBUG'
            applicationIdSuffix ".debug"
        }
        release {
            minifyEnabled false
            // proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (releaseKeystore) {
                signingConfig = signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs << "-Xlint:deprecation"
    }

    buildFeatures {
        viewBinding = true
        buildConfig = true
    }
    testOptions {
        // Android framework classes (e.g. android.util.Log) are stubs in local unit tests.
        // Return default values instead of throwing "not mocked" runtime exceptions.
        unitTests.returnDefaultValues = true
    }
    lint {
        disable 'MissingTranslation'
        abortOnError true
    }
    namespace = 'nz.mentalinc.watcher'
}

androidComponents {
    onVariants(selector().all()) { variant ->
        def appName = "MyEpisodes"
        def date = new Date().format("yyyyMMdd_HHmm")
        def versionName = android.defaultConfig.versionName
        def fileName = "${appName}_v${versionName}_${date}"

        variant.outputs.each { output ->
            output.outputFileName.set("${fileName}.apk")
        }
    }
}

dependencies {

    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation libs.androidx.room.runtime
    implementation libs.androidx.fragment
    implementation libs.androidx.appcompat
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.recyclerview
    implementation libs.androidx.swiperefreshlayout

    annotationProcessor libs.androidx.room.compiler

    debugImplementation libs.leakcanary.android

    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.androidx.test.espresso.core
    androidTestImplementation libs.androidx.room.testing
    testImplementation libs.junit
    testImplementation libs.mockito.core
    androidTestImplementation libs.okhttp.mockwebserver
    implementation libs.androidx.core

    implementation libs.material
    implementation libs.androidx.preference
    implementation libs.androidx.annotation
    implementation libs.okhttp

    implementation libs.glide
    annotationProcessor libs.glide.compiler
}

sonar {
    properties {
        property "sonar.projectKey", "MyEpispodes"
        property "sonar.host.url", "http://192.168.2.94:9000"  // URL of your SonarQube server
        property "sonar.projectName", "MyEpispodes"
        property "sonar.organization", "mentalinc"
        property "sonar.java.binaries", "**\\intermediates\\javac"

    }
}